apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-management-system
  labels:
    app: traffic-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: traffic-app
  template:
    metadata:
      labels:
        app: traffic-app
    spec:
      containers:
      - name: traffic-dashboard
        image: YOUR_DOCKERHUB_USERNAME/traffic-dashboard:latest
        ports:
        - containerPort: 80
        imagePullPolicy: Always
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: traffic-management-service
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 32080
  selector:
    app: traffic-app
